name: Build packages

on:
  release:
    types: [published]
  pull_request:
    paths: [smfc.spec, "debian/**", pyproject.toml, .github/workflows/packages.yml]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to (re)publish, e.g. v6.0.0"
        required: true

jobs:
  build-deb:
    name: Build DEB package
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools python3-build
      - name: Build DEB package
        run: |
          dpkg-buildpackage -us -uc -b
          cp ../smfc_*.deb .
      - name: Get version
        run: echo "VERSION=$(dpkg-parsechangelog -S Version)" >> $GITHUB_ENV
      - name: Upload DEB package
        uses: actions/upload-artifact@v7
        with:
          name: smfc-${{ env.VERSION }}-deb
          path: smfc_*.deb

  build-rpm:
    name: Build RPM package (${{ matrix.dist }})
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: fedora-43-x86_64, dist: fc43 }
          - { target: fedora-44-x86_64, dist: fc44 }
          - { target: alma+epel-10-x86_64, dist: el10 }

    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: dnf install -y mock rpm-build
      - name: Get version
        run: echo "VERSION=$(grep '^Version:' smfc.spec | awk '{print $2}')" >> $GITHUB_ENV
      - name: Create source tarball
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          tar czf ~/rpmbuild/SOURCES/smfc-${VERSION}.tar.gz --transform="s,^./,smfc-${VERSION}/," --exclude='.git' --exclude='.venv' .
      - name: Build SRPM package
        run: rpmbuild -bs smfc.spec
      - name: Build RPM package
        run: mock -r ${{ matrix.target }} --isolation=simple --no-bootstrap-image --resultdir=out --rebuild ~/rpmbuild/SRPMS/smfc-*.src.rpm
      - name: Upload RPM package
        uses: actions/upload-artifact@v7
        with:
          name: smfc-${{ env.VERSION }}-rpm-${{ matrix.dist }}
          path: out/smfc-*.noarch.rpm

  test-rpm:
    name: Test RPM package (${{ matrix.dist }})
    needs: build-rpm
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "fedora:43", dist: fc43 }
          - { image: "fedora:44", dist: fc44 }
          - { image: "almalinux:10", dist: el10 }

    steps:
      - name: Download RPM package
        uses: actions/download-artifact@v8
        with:
          pattern: smfc-*-rpm-${{ matrix.dist }}
          merge-multiple: true
      - name: Install RPM package
        run: dnf install -y ./smfc-*.${{ matrix.dist }}.noarch.rpm
      - name: Run smfc
        run: smfc -v

  publish:
    name: Publish packages to release and APT repository
    needs: [build-deb, build-rpm, test-rpm]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DEB artifact
        uses: actions/download-artifact@v8
        with:
          pattern: smfc-*-deb
          merge-multiple: true

      - name: Download RPM artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: smfc-*-rpm-*
          merge-multiple: true

      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.release_tag }}" smfc_*.deb smfc-*.rpm --clobber -R ${{ github.repository }}

      - name: Dispatch to smfc-deb
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/petersulyok/smfc-deb/dispatches \
            -f event_type=package-published \
            -f "client_payload[release_tag]=${{ github.event.release.tag_name || inputs.release_tag }}"

      - name: Dispatch to smfc-rpm
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/petersulyok/smfc-rpm/dispatches \
            -f event_type=package-published \
            -f "client_payload[release_tag]=${{ github.event.release.tag_name || inputs.release_tag }}"
