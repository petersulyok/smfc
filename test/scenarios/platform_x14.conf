# platform_x14.conf
# Exercises the GenericX14Platform (4 zones, direct-% level encoding, raw byte
# sequence 0x30 0x70 0x66 0x00 <zone> <level>; plus the 0x2c 0x04 0xcf 0xc2 OEM
# commands that latch per-zone manual mode at startup, confirm it on every poll
# and release it at exit).

[Ipmi]
#command=automatically generated
fan_mode_delay=0
fan_level_delay=0
platform_name=generic_x14
# Zone 0 is FAN1 (0x41), zone 1 and zone 3 use the X14DBI-SP lettered fans.
x14_zone_sensors=0x41, 0x47, 0x48, 0x49

[CPU]
enabled=1
ipmi_zone=0
temp_calc=1
sensitivity=5
polling=2
steps=5
min_temp=30
max_temp=60
min_level=35
max_level=100

[HD]
enabled=1
ipmi_zone=1
temp_calc=1
sensitivity=2
polling=5
steps=4
min_temp=32
max_temp=48
min_level=35
max_level=100
#hd_names=automatically generated
#smartctl_path=automatically generated
standby_guard_enabled=0
standby_hd_limit=1

[GPU]
enabled=0

[CONST]
enabled=1
ipmi_zone=3
polling=25
level=50
