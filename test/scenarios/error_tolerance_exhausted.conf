# error_tolerance_exhausted.conf
#
# The escalation half of the error_tolerance contract: one disk of the array becomes
# permanently unreadable, so its budget (error_tolerance=1) runs out. smfc must log the
# exhausted budget, stop, and let the exit handler push all fans to 100%.
# See smoke_runner.py (fault="hd_dead").

[Ipmi]
#command=will be generated
fan_mode_delay=0
fan_level_delay=0

[CPU]
enabled=0

[HD]
enabled=1
ipmi_zone=1
temp_calc=2
sensitivity=1
polling=1
steps=4
min_temp=32
max_temp=46
min_level=35
max_level=100
#hd_names=will be generated
#smartctl_path=will be generated
standby_guard_enabled=0
error_tolerance=1

[NVME]
enabled=0

[GPU]
enabled=0

[CONST]
enabled=0
