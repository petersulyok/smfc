# error_tolerance.conf
#
# Reproduces the issue #87 situation: one disk of the array becomes unreadable for a short
# window (the drivetemp 10 s timeout while a disk wakes up from STANDBY), then comes back.
# The failure window is shorter than the error_tolerance budget, so smfc must survive it by
# reusing the last known good temperature of that disk. See smoke_runner.py (fault="hd_flaky").

[Ipmi]
#command=will be generated
fan_mode_delay=0
fan_level_delay=0

[CPU]
enabled=0

[HD]
enabled=1
ipmi_zone=1
temp_calc=2
sensitivity=1
polling=1
steps=4
min_temp=32
max_temp=46
min_level=35
max_level=100
#hd_names=will be generated
#smartctl_path=will be generated
standby_guard_enabled=0
error_tolerance=3

[NVME]
enabled=0

[GPU]
enabled=0

[CONST]
enabled=0
