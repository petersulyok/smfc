#
#   pci_2.conf
#   Smoke test scenario: PCI fan controller with 2 PCI cards.
#
#   - CPU fan controller is enabled with 1 CPU in IPMI zone 0
#   - PCI fan controller is enabled with 2 cards in IPMI zone 1, selected by driver name
#   - the hottest card drives the fans (temp_calc=2)
#   - Other fan controllers are disabled
#
[Ipmi]
fan_mode_delay=0
fan_level_delay=0

[CPU]
enabled=1
ipmi_zone=0
temp_calc=1
sensitivity=5
polling=2
steps=5
min_temp=30
max_temp=60
min_level=35
max_level=100

[HD]
enabled=0

[PCI]
enabled=1
ipmi_zone=1
pci_driver=atlantic
temp_sensor=1
temp_calc=2
sensitivity=2.0
polling=2
steps=6
min_temp=30.0
max_temp=60.0
min_level=35
max_level=100
error_tolerance=3
