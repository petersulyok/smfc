# platform_x14_aten.conf
# Exercises X14AtenPlatform: the other BMC firmware stack of Supermicro's 14th
# generation, which every H14 board except H14SHM runs, along with the SoC boards
# X14SDW and X14SDV.
#
# `platform_name=generic_x14` is the same configuration value platform_x14_openbmc.conf
# uses. The fake BMC of this scenario answers the Part 1.1 probe with completion code
# 0xC1, so the probe in platform_factory selects the ATEN class instead. There is
# deliberately no way to force a stack from the configuration file - guessing it wrong
# applies the wrong lever to the fans (Part 1.3).
#
# The duty commands here are GenericPlatform's, byte for byte (ATEN is the firmware
# line Supermicro shipped through X9-X13). What differs is the lever: a global bypass
# flag, 0x30 0x70 0x66 0x02 0x01, suspends the BMC's automatic control loop for every
# zone. It is write-only, so control is watched through a duty read-back instead.
#
# Note the [CONST] min_level: on this platform a duty below 5% is raised to 5% before
# it reaches the BMC, because the ATEN percent duty path has no floor of its own.

[Ipmi]
#command=automatically generated
fan_mode_delay=0
fan_level_delay=0
platform_name=generic_x14

[CPU]
enabled=1
ipmi_zone=0
temp_calc=1
sensitivity=5
polling=2
steps=5
min_temp=30
max_temp=60
min_level=35
max_level=100

[HD]
enabled=1
ipmi_zone=1
temp_calc=1
sensitivity=2
polling=5
steps=4
min_temp=32
max_temp=48
min_level=35
max_level=100
#hd_names=automatically generated
#smartctl_path=automatically generated
standby_guard_enabled=0
standby_hd_limit=1

[GPU]
enabled=0

[CONST]
enabled=1
ipmi_zone=3
# Polled every second so the fixed zone-3 duty is exercised on every pass. This zone is where the two
# ATEN duty paths of Part 4.4 differ visibly: on the PWM path the BMC reports 49% back for a 50% write, so
# the controller rewrites it every poll, while on the percent path the read-back is exact and the write is
# correctly skipped. The platform_x14_aten_percent scenario runs this same file against that path.
polling=1
level=50
